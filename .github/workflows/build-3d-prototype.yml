name: NBA 2K27 Realistic Project CI Pipeline

on:
  push:
    branches: [main, production_stable]
    paths:
      - "prototype3d/**"
      - ".github/workflows/build-3d-prototype.yml"
  pull_request:
    branches: [main, production_stable]
    paths:
      - "prototype3d/**"
      - ".github/workflows/build-3d-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code_compilation:
    name: Code compilation and TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype3d
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build

  asset_bundle_validation:
    name: Asset bundle validation
    runs-on: ubuntu-latest
    needs: code_compilation
    defaults:
      run:
        working-directory: prototype3d
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Validate generated assets
        run: npm run validate:assets

  memory_leak_check:
    name: Static memory and lifecycle audit
    runs-on: ubuntu-latest
    needs: code_compilation
    defaults:
      run:
        working-directory: prototype3d
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit timer cleanup and lifecycle hazards
        run: npm run audit:memory

  roster_integrity:
    name: Roster JSON integrity validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current sample roster JSON
        run: |
          node -e "const fs=require('fs'); const p='prototype3d/src/data/roster-sample-2026-27.json'; const data=JSON.parse(fs.readFileSync(p,'utf8')); if (!Array.isArray(data)) throw new Error('Roster root must be an array'); console.log('Roster JSON valid:', data.length, 'entries');"

  upload_build:
    name: Publish prototype build artifact
    runs-on: ubuntu-latest
    needs: [code_compilation, asset_bundle_validation, memory_leak_check, roster_integrity]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build
        working-directory: prototype3d
        run: npm install && npm run build
      - name: Upload 3D prototype build
        uses: actions/upload-artifact@v4
        with:
          name: nba-2k27-3d-prototype
          path: prototype3d/dist/
          if-no-files-found: error
